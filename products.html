<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Browse Toy Haven figurines, toys, board games and diecast model cars."
    >

    <meta
        name="theme-color"
        content="#2563eb"
    >

    <title>Toy Haven | Products</title>

    <link
        rel="stylesheet"
        href="CSS/style.css"
    >

    <link
        rel="icon"
        type="image/svg+xml"
        href="IMAGES/favicon.svg"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

</head>


<body>


    <!-- =========================================
         NAVIGATION
    ========================================== -->

    <header>

        <nav class="navbar">

            <a
                class="brand"
                href="index.html"
                aria-label="Toy Haven home"
            >

                <span
                    class="brand-logo"
                    aria-hidden="true"
                >
                    TH
                </span>

                <span class="brand-name">
                    Toy Haven
                </span>

            </a>


            <ul class="nav-links">

                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a
                        href="products.html"
                        class="active"
                    >
                        Products
                    </a>
                </li>

                <li>
                    <a href="wishlist.html">
                        Favourites
                    </a>
                </li>

                <li>
                    <a href="cart.html">
                        Cart
                    </a>
                </li>

                <li>
                    <a href="feedback.html">
                        Feedbacks
                    </a>
                </li>

            </ul>


            <button
                class="menu-button"
                id="menuButton"
                type="button"
                aria-label="Open menu"
            >
                ☰
            </button>

        </nav>

    </header>



    <!-- =========================================
         PRODUCTS PAGE
    ========================================== -->

    <main class="products-page">


        <div class="page-heading">

            <h1>
                Our Products
            </h1>

            <p>
                Browse figurines, toys,
                board games and diecast cars.
            </p>

        </div>



        <!-- SEARCH AND SORT -->

        <div class="products-toolbar">

            <input
                type="search"
                id="searchInput"
                placeholder="Search products..."
                aria-label="Search products"
            >


            <select
                id="sortSelect"
                aria-label="Sort products"
            >

                <option value="default">
                    Sort By
                </option>

                <option value="nameAZ">
                    Name A - Z
                </option>

                <option value="nameZA">
                    Name Z - A
                </option>

                <option value="priceLow">
                    Price: Low to High
                </option>

                <option value="priceHigh">
                    Price: High to Low
                </option>

            </select>

        </div>



        <!-- PRODUCT FILTERS -->

        <div class="filter-buttons">

            <button
                class="filter-btn active"
                type="button"
                data-category="all"
            >
                All
            </button>

            <button
                class="filter-btn"
                type="button"
                data-category="Figurines"
            >
                Figurines
            </button>

            <button
                class="filter-btn"
                type="button"
                data-category="Toys"
            >
                Toys
            </button>

            <button
                class="filter-btn"
                type="button"
                data-category="Board Games"
            >
                Board Games
            </button>

            <button
                class="filter-btn"
                type="button"
                data-category="Diecast Cars"
            >
                Diecast Cars
            </button>

        </div>



        <!-- PRODUCTS ADDED BY JAVASCRIPT -->

        <div
            class="products-grid"
            id="productsGrid"
        >
        </div>


    </main>



    <!-- =========================================
         PRODUCT DETAILS MODAL
    ========================================== -->

    <div
        class="product-modal"
        id="productModal"
        role="dialog"
        aria-modal="true"
        aria-label="Product details"
    >

        <div class="modal-content">

            <button
                class="close-modal"
                id="closeModal"
                type="button"
                aria-label="Close product details"
            >
                &times;
            </button>

            <div id="modalProductContent">
            </div>

        </div>

    </div>



    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer>

        <h2>
            Toy Haven
        </h2>

        <p>
            Toys • Games • Collectibles
        </p>


        <div class="footer-links">

            <a href="index.html">
                Home
            </a>

            <a href="products.html">
                Products
            </a>

            <a href="wishlist.html">
                Favourites
            </a>

            <a href="cart.html">
                Cart
            </a>

            <a href="feedback.html">
                Feedbacks
            </a>

        </div>


        <p>
            &copy; 2026 Toy Haven.
            All rights reserved.
        </p>

    </footer>



    <!-- JAVASCRIPT -->

    <script src="JS/script.js"></script>

    <script src="JS/pwa.js"></script>


</body>

</html>
